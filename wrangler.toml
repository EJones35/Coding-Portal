name = "coding-sessions-portal"
main = "src/server/index.js"
compatibility_date = "2026-10-11"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "scratch-portal-db"
database_id = "66574faa-06ae-412d-9244-d44003014964"
migrations_dir = "migrations"

# OAuth secrets will be added with `wrangler secret put` in a later stage.
# Never put client secrets or tokens in this file or in source control.
