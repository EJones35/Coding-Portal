name: CI

# Pull requests are validated here. Pushes to main are validated and deployed
# by deploy.yml instead, so the checks are not run twice for the same commit.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
