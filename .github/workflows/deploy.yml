name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Guard probe
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: echo "token is present"
